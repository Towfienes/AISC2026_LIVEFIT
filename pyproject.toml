[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livelift"
version = "0.1.0"
description = "LiveLift — nền tảng thí nghiệm vận hành cho livestream thương mại (AISC'26)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "LiveLift Team" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.optional-dependencies]
# API server + ingest runtime (inside Docker)
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.1",
    "redis>=5.0",
    "httpx>=0.27",
    "yt-dlp>=2025.1.1",
]
# Modeling extras — heavy, install only where needed.
# scikit-learn is pinned to a range because the intent artifact (joblib) is
# NOT portable across sklearn majors; intent.py warns when the running
# version differs from the one recorded at training time.
ml = [
    "scikit-learn==1.9.0",
    "lightgbm>=4.3",
    "statsmodels>=0.14",
]
# Vietnamese NLP — heavy (torch); only on the NLP worker
nlp = [
    "underthesea>=6.8",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
livelift-migrate = "livelift.dbops.migrate:main"
livelift-qc = "livelift.core.quality_cli:main"
livelift-schedule = "livelift.core.assigner.cli:main"
livelift-simulate = "livelift.sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/livelift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running statistical validation (deselect with '-m \"not slow\"')",
    "db: requires a running PostgreSQL (docker compose up db)",
    "browser: drives a real headless browser (Playwright + node); always paired with slow",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "PT", "RET", "SIM"]
ignore = [
    "S101",  # assert is fine in tests and invariant checks
    "S311",  # random is used deliberately with seeded RNG for experiment assignment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PT011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
