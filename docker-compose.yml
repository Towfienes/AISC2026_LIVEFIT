name: livelift

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livelift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-livelift}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-livelift} -d ${POSTGRES_DB:-livelift}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["livelift-migrate", "up"]
    # STORE_BACKEND: postgres là dòng quyết định dữ liệu có sống sót hay không.
    # DATABASE_URL chỉ nói cơ sở dữ liệu ở ĐÂU; thiếu STORE_BACKEND thì API vẫn
    # chạy ngon lành và giữ mọi thứ trong RAM (sự cố 25/08/2026), và một lần
    # restart là mất sạch (sự cố 11/09/2026: 13 phiên live thật, 17.535 bình
    # luận). Kiểm tra sau khi dựng: curl -s .../health → "durable": true.
    # Ba lớp bảo vệ của ngăn xếp này: db (volume pgdata) → backup (dump ngày,
    # đã xác minh, giữ 14 ngày) → docs/luu-tru-du-lieu.md giải thích khi nào
    # dùng chế độ nào.
    environment: &app_env
      DATABASE_URL: postgresql://${POSTGRES_USER:-livelift}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-livelift}
      REDIS_URL: redis://redis:6379/0
      LIVELIFT_ENV: ${LIVELIFT_ENV:-dev}
      STORE_BACKEND: postgres
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "livelift.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app_env
    # Không publish cổng ra ngoài — mọi truy cập đi qua caddy. Cần cổng dev
    # trực tiếp (127.0.0.1:8000)? Dùng thêm docker-compose.dev-ports.yml.
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      dockerfile: ../docker/web.Dockerfile
      args:
        # Next.js nhúng NEXT_PUBLIC_* vào bundle LÚC BUILD — đổi giá trị trong
        # .env thì phải `docker compose build web` lại. Mặc định trỏ qua caddy.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
        NEXT_PUBLIC_PUBLIC_API_BASE: ${NEXT_PUBLIC_PUBLIC_API_BASE:-}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    # Không publish cổng ra ngoài — mọi truy cập đi qua caddy (xem ghi chú ở api).
    expose:
      - "3000"
    depends_on:
      - api

  # Cổng vào công khai duy nhất: HTTPS tự động khi DOMAIN là tên miền thật,
  # http://localhost khi để trống (dev). Route: /r/* + /api/* + /ws/* + /docs
  # + /openapi.json → api; còn lại → web. Xem docker/Caddyfile.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
      - web

  # Daily DB backup to ./backups (mount a synced-to-Drive folder in production VPS)
  backup:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-livelift}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-livelift}
    volumes:
      - ./backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
