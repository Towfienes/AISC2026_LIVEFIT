name: livelift

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livelift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-livelift}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-livelift} -d ${POSTGRES_DB:-livelift}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["livelift-migrate", "up"]
    environment: &app_env
      DATABASE_URL: postgresql://${POSTGRES_USER:-livelift}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-livelift}
      REDIS_URL: redis://redis:6379/0
      LIVELIFT_ENV: ${LIVELIFT_ENV:-dev}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "livelift.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app_env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      dockerfile: ../docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  # Daily DB backup to ./backups (mount a synced-to-Drive folder in production VPS)
  backup:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-livelift}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-livelift}
    volumes:
      - ./backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
